[project]
name = "terraverdict"
version = "0.1.0"
description = "Detective de tendencias con Sello de Confianza para cuencas de montaña"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31", "numpy>=1.26", "scipy>=1.11", "pymannkendall>=1.4",
  "statsmodels>=0.14", "pydantic>=2.5", "pyyaml>=6", "typer>=0.12",
]
[project.optional-dependencies]
geo = ["xarray", "rioxarray", "geopandas", "rasterio", "regionmask", "earthaccess", "pyarrow", "duckdb"]
# PyTorch CPU: pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["scikit-learn>=1.5", "pandas>=2.2", "ruptures>=1.1", "PyWavelets>=1.6", "torch>=2.4"]
hydro = ["numba", "pysheds"]
api = ["fastapi", "uvicorn", "mcp"]
dev = ["pytest", "hypothesis", "ruff", "mypy", "types-requests", "types-PyYAML", "scipy-stubs"]
[project.scripts]
tv = "terraverdict.cli:app"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo y pruebas lentas", "red: requiere red"]
addopts = "-m 'not slow and not red'"
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["backend", "frontend", "web", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
# E501: líneas largas de documentación; B008: patrón de typer; RUF001-003: caracteres del español.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["terraverdict", "tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
